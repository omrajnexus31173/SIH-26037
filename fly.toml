# Change `app` to your own Fly.io application name before deploying.
app = "sih26037-backend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  SIH_HOST = "0.0.0.0"
  SIH_BACKEND_PORT = "8000"
  SIH_USE_HTTPS = "0"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
